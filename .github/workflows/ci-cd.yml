name: CI-CD
 
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Set up environment for tests
        run: |
          echo "${{ secrets.APP_ENV_FILE }}" > .env.local

      - name: Run tests
        run: pytest -v

  deploy:
    name: Deploy to GCE
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            set -e
            cd /home/${USER}/crypto-analytics-platform || cd /home/${USERNAME}/crypto-analytics-platform || cd /home/${{ secrets.GCE_USER }}/crypto-analytics-platform
            git fetch origin main
            git reset --hard origin/main
            docker compose down --remove-orphans || true
            docker compose pull || true
            docker compose up -d --build

