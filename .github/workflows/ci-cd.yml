name: Production CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: sarfraspc

jobs:
  # JOB 1: TEST (Run Unit Tests)
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Create Dummy Google Creds
        run: |
          echo '{"type": "service_account"}' > google_dummy.json

      - name: Load Test Config
        run: grep -v '^#' tests/.env.test | grep -v '^$' >> $GITHUB_ENV

      - name: Run Pytest
        run: pytest -v

  # JOB 2: BUILD & PUSH (Build Docker Images in Cloud)
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test # Only build if tests pass
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend
      - name: Build/Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cap-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build MLflow
      - name: Build/Push MLflow
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.mlflow
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cap-mlflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Frontend
      - name: Build/Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cap-frontend:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 3: DEPLOY (Pull images on Server)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          envs: CR_PAT
          script: |
            set -e
            
            # 1. Login to Registry
            echo "$CR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Go to Project Folder
            mkdir -p /home/${{ secrets.GCE_USER }}/crypto-analytics-platform
            cd /home/${{ secrets.GCE_USER }}/crypto-analytics-platform
            
            # 3. Update Code
            if [ ! -d ".git" ]; then
              git clone https://github.com/sarfraspc/crypto-analytics-platform.git .
            fi
            git fetch origin main
            git reset --hard origin/main
            
            # 4. INJECT SECRETS (
            mkdir -p secrets
            
            # Create standard .env for Docker Compose variable substitution
            echo "${{ secrets.PROD_ENV_FILE }}" > .env
            
            # Create copy as .env.docker for containers that expect it
            cp .env .env.docker
            
            # Create service-account.json
            echo "${{ secrets.GCP_SA_KEY }}" > secrets/service-account.json
            
            # 5. Pull & Restart
            docker compose pull
            docker compose up -d --remove-orphans
            
            # 6. Cleanup
            docker image prune -af --filter "until=24h"
            docker system prune -f
            docker builder prune -f